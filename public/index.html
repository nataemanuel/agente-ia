<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Chat IA</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="chat-container">

    <div class="modal-overlay" id="modalOverlay" onclick="toggleSidebar()"></div>

    <div class="sidebar" id="sidebarMenu">
        <div class="sidebar-header-container">
            <button class="btn-new-chat" onclick="startNewChat()">+ Nova Conversa</button>
            <button class="btn-delete-history" onclick="clearCurrentHistory()">Apagar Conversa Atual</button>
        </div>
        <div class="sidebar-content" id="historyContent"></div>
    </div>

    <div class="main-chat">
        <div class="chat-header">
            <button class="btn-menu-mobile" onclick="toggleSidebar()">☰</button>
            
            <h3>NathanBot</h3>
            <span id="chat-status">Nova sessão</span>
        </div>


       <div class="typing-indicator" id="typingBubble" style="display:none;">

    <span></span>
    <span></span>
    <span></span>

</div>


<div class="chat-messages" id="chatbox"></div>


        <div class="chat-input-area">

            <input 
            type="text" 
            id="userInput"
            placeholder="Digite sua mensagem aqui..."
            onkeydown="if(event.key === 'Enter') sendMessage()">


            <button onclick="sendMessage()">
                Enviar
            </button>

        </div>


    </div>


</div>


<script>

let currentSessionId = "";


// inicia página
window.onload = function(){

    startNewChat();

    loadAllChats();

};



// ==========================
// NOVA CONVERSA
// ==========================

function startNewChat(){

    currentSessionId = "chat-" + Date.now();


    const chatbox = document.getElementById("chatbox");

    chatbox.innerHTML = "";


    const welcome = document.createElement("p");

    welcome.id = "welcome-msg";

    welcome.style.textAlign = "center";
    welcome.style.color = "#80868b";
    welcome.style.fontSize = "0.9rem";
    welcome.style.marginTop = "20px";

    welcome.textContent =
    "Comece uma nova conversa!";


    chatbox.appendChild(welcome);


    document.getElementById("chat-status").innerText =
    "Conversa Ativa";


    hideTyping();

}



// ==========================
// ANIMAÇÃO DIGITANDO
// ==========================

function showTyping(){

    const bubble =
    document.getElementById("typingBubble");


    if(bubble){

        bubble.style.display = "flex";

    }

}



function hideTyping(){

    const bubble =
    document.getElementById("typingBubble");


    if(bubble){

        bubble.style.display = "none";

    }

}



// ==========================
// ENVIAR MENSAGEM
// ==========================

async function sendMessage(){


    const input =
    document.getElementById("userInput");


    const chatbox =
    document.getElementById("chatbox");


    const message =
    input.value.trim();



    if(!message) return;



    const welcome =
    document.getElementById("welcome-msg");


    if(welcome){

        welcome.remove();

    }



    // mensagem usuário

    const userDiv =
    document.createElement("div");


    userDiv.className =
    "message user";


    userDiv.innerHTML =
    `<b>Você:</b><br>${message}`;


    chatbox.appendChild(userDiv);



    input.value = "";



    showTyping();



    try{


        const response =
        await fetch("/chat",{

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },


            body:JSON.stringify({

                message,

                sessionId:currentSessionId

            })


        });



        const data =
        await response.json();



        hideTyping();



        if(data.reply){



            const botDiv =
            document.createElement("div");


            botDiv.className =
            "message bot";


            botDiv.innerHTML =
            `<b>Gemini:</b><br>${data.reply}`;


            chatbox.appendChild(botDiv);



            loadAllChats();



        }else{


            showError(data.error);


        }



    }catch(error){


        hideTyping();


        showError(
        "Conexão falhou."
        );


    }



    chatbox.scrollTop =
    chatbox.scrollHeight;


}



// mensagem de erro

function showError(text){


    const chatbox =
    document.getElementById("chatbox");


    const error =
    document.createElement("div");


    error.className =
    "message error";


    error.innerHTML =
    `<b>Erro:</b> ${text}`;


    chatbox.appendChild(error);


}



// ==========================
// LISTAR CONVERSAS
// ==========================

async function loadAllChats(){


    const historyContent =
    document.getElementById("historyContent");


    try{


        const response =
        await fetch("/historico/lista/sessoes");


        const sessoes =
        await response.json();



        historyContent.innerHTML="";



        if(sessoes.length===0){


            historyContent.innerHTML =
            "<p>Nenhum chat salvo.</p>";


            return;

        }



        sessoes.forEach(sessao=>{


            const item =
            document.createElement("div");


            item.className =
            "history-item";


            item.innerText =
            sessao.titulo || "Conversa sem título";


            item.onclick =
            ()=>loadSpecificChat(sessao._id);



            historyContent.appendChild(item);


        });



    }catch(error){

        console.log(error);

    }


}



// ==========================
// ABRIR HISTÓRICO
// ==========================

async function loadSpecificChat(sessionId){


    currentSessionId =
    sessionId;


    const chatbox =
    document.getElementById("chatbox");


    hideTyping();



    chatbox.innerHTML =
    "<p>Carregando conversa...</p>";



    try{


        const response =
        await fetch(`/historico/${sessionId}`);



        const mensagens =
        await response.json();



        chatbox.innerHTML="";



        mensagens.forEach(msg=>{


            const div =
            document.createElement("div");


            div.className =
            msg.role==="user"
            ? "message user"
            : "message bot";



            div.innerHTML =
            `<b>${msg.role==="user"?"Você":"Gemini"}:</b><br>${msg.text}`;



            chatbox.appendChild(div);



        });



    }catch(error){


        chatbox.innerHTML =
        "<p>Erro ao carregar mensagens.</p>";


    }


}



// ==========================
// APAGAR CONVERSA
// ==========================

async function clearCurrentHistory(){


    if(!confirm(
    "Deseja apagar esta conversa?"
    ))
    return;



    await fetch(
    `/historico/${currentSessionId}`,
    {
        method:"DELETE"
    });



    startNewChat();


    loadAllChats();


}
function toggleSidebar() {
    const sidebar = document.getElementById("sidebarMenu");
    const overlay = document.getElementById("modalOverlay");
    
    sidebar.classList.toggle("active");
    overlay.classList.toggle("active");
}

</script>


</body>
</html>
